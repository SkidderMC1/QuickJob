<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>EasyJob — Local Microjobs Marketplace</title>
  <meta name="description" content="EasyJob connects young people (14–25), adults, and verified companies for local microjobs with two-stage location privacy and escrow payment protection." />
  <meta name="theme-color" content="#0091ff" />

  <!-- iOS / iPad Web App Standalone Capabilities -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="EasyJob" />

  <!-- Web App Manifest & App Icons -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <!-- Fonts Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/mobile-chassis.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!-- App Mount Root -->
  <div id="app-root"></div>

  <!-- Main ES Module Application -->
  <script type="module" src="js/app.js"></script>

  <!-- PWA Service Worker Registration (external file for a strict CSP) -->
  <script src="js/sw-register.js" defer></script>
</body>
</html>
